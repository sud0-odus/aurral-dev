name: Download scheduler validation

on:
  pull_request:
    branches: [dev/youtube-source-matching]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduler-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --test --import ./.tests/setup-env.js .tests/download/provider-scheduler-policy.test.js
      - run: npm run lint
      - run: npm run build
