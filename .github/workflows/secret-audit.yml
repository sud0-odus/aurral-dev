name: Secret audit

on:
  push:
    branches: [dev/ct119-integration-pilot]
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-history:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked Git history without printing secret values
        run: |
          docker run --rm --mount type=bind,source="$PWD",target=/repo,readonly \
            ghcr.io/gitleaks/gitleaks:v8.28.0 git --source=/repo --redact --no-banner
