name: Secret audit

on:
  push:
    branches: [dev/ct119-integration-pilot]
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-history:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan and print metadata only (never findings or secret values)
        run: |
          docker run --rm --mount type=bind,source="$PWD",target=/repo,readonly \
            --mount type=bind,source="$RUNNER_TEMP",target=/audit \
            ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo \
            --redact --no-banner --report-format json --report-path /audit/findings.json --exit-code 0
          python3 - <<'PY'
          import collections
          import json
          import pathlib
          import sys
          path = pathlib.Path(__import__('os').environ['RUNNER_TEMP']) / 'findings.json'
          findings = json.loads(path.read_text()) if path.exists() else []
          print(f"TOTAL_FINDINGS={len(findings)}")
          rules = collections.Counter(f.get('RuleID', 'unknown') for f in findings)
          for rule, count in sorted(rules.items()):
              print(f"RULE count={count} id={rule}")
          pairs = collections.Counter((f.get('File', '?'), f.get('RuleID', '?')) for f in findings)
          for (file, rule), count in sorted(pairs.items()):
              print(f"FILE_RULE count={count} rule={rule} path={file}")
          # Commit identifiers are metadata; print abbreviated hashes only.
          commits = collections.Counter(str(f.get('Commit', 'unknown'))[:12] for f in findings)
          for commit, count in commits.most_common(25):
              print(f"COMMIT count={count} sha12={commit}")
          path.unlink(missing_ok=True)
          if findings:
              sys.exit(1)
          PY
