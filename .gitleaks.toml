title = "Aurral Gitleaks history audit: verified false positives"

[extend]
useDefault = true

# Each exception requires BOTH the specific path and the known harmless
# matching text, and only the inspected harmless strings.
# Do not ignore entire files, commits, or generic-api-key globally.

[[allowlists]]
description = "MusicBrainz recording IDs in track-matching acceptance fixture"
condition = "AND"
regexTarget = "match"
paths = ['''^\.tests/track-matching/fixtures/acceptance\.jsonl$''']
regexes = ['''recording-[0-9]+''']

[[allowlists]]
description = "MusicBrainz recording IDs in track-matching development fixture"
condition = "AND"
regexTarget = "match"
paths = ['''^\.tests/track-matching/fixtures/development\.jsonl$''']
regexes = ['''recording-[0-9]+''']

[[allowlists]]
description = "Frontend player keyboard-shortcut label"
condition = "AND"
regexTarget = "match"
paths = ['''^frontend/src/hooks/usePlayerShortcuts\.js$''']
regexes = ['''Shift\+ArrowLeft''']

[[allowlists]]
description = "API docs example header containing literal YOUR_API_KEY placeholder"
condition = "AND"
regexTarget = "line"
paths = ['''^docs/src/content/docs/api/overview\.mdx$''']
regexes = ['''X-Api-Key:\s*YOUR_API_KEY''']

[[allowlists]]
description = "Phase 2 testing docs example Basic auth literal placeholder"
condition = "AND"
regexTarget = "line"
paths = ['''^PHASE2_TESTING\.md$''']
regexes = ['''admin:YOUR_PASSWORD''']
